<section id="socios" class="section">
  <div class="container">
    <div class="section__header">
      <h2>Socios</h2>
      <p>Organizaciones e instituciones que acompañan la misión del hub.</p>
    </div>

    <div class="partners-grid">
      {% for partner in site.data.partners %}
      <a href="{{ partner.url }}" class="partner-card" target="_blank" rel="noopener" aria-label="{{ partner.name }}">
        <img src="{{ partner.logo | relative_url }}" alt="{{ partner.name }}">
      </a>
      {% endfor %}
    </div>
  </div>
</section>
